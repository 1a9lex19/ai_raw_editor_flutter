name: Build AI RAW Editor APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.alex19 .

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"

      - name: Build LibRaw for Android arm64
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config build-essential

          git clone --depth 1 https://github.com/LibRaw/LibRaw.git /tmp/libraw
          cd /tmp/libraw

          ./configure --help >/dev/null
          autoreconf -fi

          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.0.13004108"
          export TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC="$TOOLCHAIN/bin/aarch64-linux-android35-clang"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android35-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"

          ./configure \
            --host=aarch64-linux-android \
            --disable-static \
            --enable-shared \
            --disable-examples \
            --disable-jasper

          make -j2
          make DESTDIR=/tmp/libraw-install install

          mkdir -p "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          cp -L /tmp/libraw-install/usr/local/lib/libraw.so* "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/" || true

          LIBRAW_SO=$(find "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a" -maxdepth 1 -type f -name 'libraw.so*' | head -n1)
          test -n "$LIBRAW_SO"
          cp "$LIBRAW_SO" "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libraw.so"
          rm -f "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libraw.so."*
          file "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libraw.so"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-raw-editor-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
